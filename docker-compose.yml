services:

  web:
    build: .

    container_name: banking_web

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    depends_on:
      - redis
      - postgres

    env_file:
      - .env

    environment:
      REDIS_URL: redis://redis:6379/1

    command: python manage.py runserver 0.0.0.0:8000



  celery:
    build: .

    container_name: banking_celery

    command: celery -A config worker --loglevel=info

    volumes:
      - .:/app

    env_file:
      - .env

    environment:
      REDIS_URL: redis://redis:6379/1

    depends_on:
      - postgres
      - redis
      - rabbitmq


  redis:
    image: redis:7-alpine

    container_name: banking_redis

    restart: unless-stopped

    ports:
      - "6379:6379"

  postgres:
    image: postgres:17-alpine

    container_name: banking_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: banking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: python123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d banking_db"]
      interval: 10s
      timeout: 5s
      retries: 5
  

  rabbitmq:
    image: rabbitmq:3.13-management

    container_name: banking_rabbitmq

    restart: unless-stopped

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq



volumes:
  postgres_data:
  rabbitmq_data: